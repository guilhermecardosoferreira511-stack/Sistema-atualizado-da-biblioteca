{% extends "base.html" %}

{% block title %}Novo Livro - Biblioteca{% endblock %}

{% block content %}
<div class="container">
    <h2>Cadastrar Novo Livro 📖</h2>

    <form method="POST" action="{{ url_for('auth.cadastrar_livro') }}">
        <div>
            <label for="titulo">Título do Livro:</label>
            <input type="text" id="titulo" name="titulo" required autocomplete="off">
        </div>

        <div>
            <label for="autor">Autor:</label>
            <input type="text" id="autor" name="autor" required autocomplete="off">
        </div>

        <div>
            <label for="ano">Ano de Publicação:</label>
            <input type="number" id="ano" name="ano" required>
        </div>

        <button type="submit" style="margin-top: 15px;">Salvar Livro</button>
    </form>
    
    <p style="margin-top: 15px;">
        <a href="{{ url_for('auth.welcome') }}">← Voltar para a Listagem</a>
    </p>
</div>
{% endblock %}
